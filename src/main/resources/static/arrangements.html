<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>面試安排 · 招募系統</title>
<style>
  :root{
    --bg:#f4f5f8; --surface:#ffffff; --ink:#1f2430; --muted:#667085;
    --line:#dfe3ec; --line-strong:#c7cdda; --head:#eef1f7;
    --accent:#2563eb; --accent-ink:#1d4ed8;
    --hr:#0f7d6b; --hr-soft:#e0f2ee;      /* HR 綠 */
    --mgr:#4b48d6; --mgr-soft:#ecebfb;    /* 主管 紫 */
    --sys:#8a92a6;
    --danger:#d21f3c; --ok:#15803d;
    --sans:"Segoe UI","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
    --mono:ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px}
  .wrap{max-width:1480px;margin:0 auto;padding:18px 20px 48px}

  .topbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand h1{font-size:19px;margin:0;font-weight:700}
  .brand .sub{color:var(--muted);font-size:12.5px}
  .nav{display:flex;gap:4px;background:#e7ebf3;padding:4px;border-radius:10px}
  .nav a{padding:6px 14px;border-radius:7px;text-decoration:none;color:#41495c;font-weight:600;font-size:12.5px}
  .nav a.active{background:#fff;color:var(--accent-ink);box-shadow:0 1px 2px rgba(16,24,40,.08)}
  .nav a{transition:background .12s,color .12s}
  .nav a:not(.active):hover{background:rgba(255,255,255,.6);color:var(--accent-ink)}
  .spacer{margin-left:auto}

  /* 角色切換 */
  .rolebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 14px;
           background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:12px 16px}
  .roleseg{display:flex;gap:4px;background:#eef1f7;padding:4px;border-radius:9px}
  .roleseg button{font:inherit;font-weight:700;cursor:pointer;border:none;background:none;padding:7px 16px;border-radius:7px;color:#54607a;transition:background .12s,color .12s}
  .roleseg button:not(.on):hover{background:#e2e7f1;color:var(--ink)}
  .roleseg button.on[data-role="HR"]{background:var(--hr);color:#fff}
  .roleseg button.on[data-role="MANAGER"]{background:var(--mgr);color:#fff}
  .roleseg button.on:hover{filter:brightness(.94)}
  .roledesc{font-size:12.5px;color:var(--muted);line-height:1.5}
  .roledesc b{color:var(--ink)}
  .mgrfilter{margin-left:auto;display:flex;align-items:center;gap:8px}
  .mgrfilter input,.mgrfilter select{font:inherit;padding:7px 10px;border:1px solid var(--line-strong);border-radius:7px;background:#fff;color:var(--ink)}

  .btn{font:inherit;font-weight:600;cursor:pointer;border-radius:8px;padding:8px 14px;border:1px solid var(--line-strong);
       background:#fff;color:var(--ink);display:inline-flex;align-items:center;gap:6px;transition:.12s}
  .btn:hover{border-color:var(--accent);color:var(--accent-ink)}
  .btn.hr{background:var(--hr);border-color:var(--hr);color:#fff}
  .btn.mgr{background:var(--mgr);border-color:var(--mgr);color:#fff}
  .btn.hr:hover,.btn.mgr:hover{filter:brightness(.94);color:#fff}
  .btn.sm{padding:5px 11px;font-size:12px;border-radius:7px}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:2px 0 12px}
  .toolbar input{font:inherit;padding:7px 10px;border:1px solid var(--line-strong);border-radius:7px;min-width:220px}
  .toolbar .count{margin-left:auto;color:var(--muted);font-size:12.5px}

  .grid{overflow:auto;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);box-shadow:0 1px 2px rgba(16,24,40,.04);overscroll-behavior-x:contain}
  table{border-collapse:separate;border-spacing:0;width:100%;white-space:nowrap;min-width:1150px}
  /* 可面試日期：保留主管換行、但每行不再自動折行擠成一坨（靠橫向捲動看完整內容） */
  td.dates{white-space:pre;min-width:200px}
  th,td{padding:9px 12px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:left;vertical-align:middle}
  th{position:sticky;top:0;z-index:2;background:var(--head);font-weight:600;color:#3a4256;border-bottom:1px solid var(--line-strong)}
  th:first-child,td:first-child{position:sticky;left:0;z-index:1;background:#fafbfd;color:var(--muted);font-variant-numeric:tabular-nums}
  th:first-child{z-index:3;background:var(--head)}
  th:last-child,td:last-child{position:sticky;right:0;z-index:1;background:#fafbfd;border-right:none;border-left:1px solid var(--line-strong);box-shadow:-6px 0 8px -6px rgba(16,24,40,.18)}
  th:last-child{z-index:3;background:var(--head)}
  tbody tr:hover td{background:#f3f7ff}
  td.mono{font-family:var(--mono);font-size:12px;color:#475067}
  .colhr{background:var(--hr-soft)!important}
  .colmgr{background:var(--mgr-soft)!important}
  th .tag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px;margin-left:6px;vertical-align:middle}
  th .tag.hr{background:var(--hr);color:#fff} th .tag.mgr{background:var(--mgr);color:#fff} th .tag.sys{background:#dde2ec;color:#5b657a}
  .missing{color:#b6bccb}
  .mstat{font-weight:700}
  .mstat.ok{color:var(--ok)}
  .mstat.err{color:var(--danger);cursor:help;border-bottom:1px dotted var(--danger)}
  a.reslink{color:var(--accent-ink);text-decoration:none;font-weight:600}
  a.reslink:hover{text-decoration:underline}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .banner{margin:0 0 12px;padding:8px 12px;border-radius:8px;background:#fff7e6;border:1px solid #f2d98a;color:#7a5b00;font-size:12.5px;display:none}
  footer{margin-top:18px;color:var(--muted);font-size:11.5px}

  .mask{position:fixed;inset:0;background:rgba(20,26,40,.42);display:none;z-index:40}
  .mask.show{display:block}
  .drawer{position:fixed;top:0;right:0;height:100%;width:440px;max-width:94vw;background:var(--surface);
          box-shadow:-6px 0 24px rgba(16,24,40,.16);transform:translateX(100%);transition:transform .22s ease;z-index:50;display:flex;flex-direction:column}
  .drawer.show{transform:translateX(0)}
  .dhead{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
  .dhead h2{margin:0;font-size:16px;font-weight:700}
  .dhead .rolechip{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px}
  .dhead .rolechip.HR{background:var(--hr-soft);color:var(--hr)} .dhead .rolechip.MANAGER{background:var(--mgr-soft);color:var(--mgr)}
  .dhead .x{margin-left:auto;cursor:pointer;border:none;background:none;font-size:20px;color:var(--muted);padding:2px 6px;border-radius:6px}
  .dhead .x:hover{background:var(--head);color:var(--ink)}
  .dbody{padding:18px 20px;overflow:auto;flex:1}
  .sect{margin-bottom:20px}
  .sect h3{margin:0 0 10px;font-size:12.5px;font-weight:700;color:#41495c;text-transform:uppercase;display:flex;align-items:center;gap:8px}
  .sect h3::after{content:"";flex:1;height:1px;background:var(--line)}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12.5px}
  .kv dt{color:var(--muted)} .kv dd{margin:0;word-break:break-all}
  .field{margin-bottom:11px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  .field input,.field textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line-strong);border-radius:7px;background:#fff;color:var(--ink)}
  .field textarea{min-height:60px;resize:vertical}
  .ferr{margin-top:4px;font-size:12px;color:var(--danger)}
  .field textarea.invalid,.field input.invalid{border-color:var(--danger)}
  .lock{padding:12px;border-radius:9px;background:var(--head);color:var(--muted);font-size:12px;line-height:1.55}
  .actions{display:flex;justify-content:flex-end;gap:8px}

  #toasts{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center}
  .toast{padding:10px 16px;border-radius:9px;font-size:13px;font-weight:600;color:#fff;box-shadow:0 6px 18px rgba(16,24,40,.22)}
  .toast.ok{background:var(--ok)} .toast.err{background:var(--danger)} .toast.info{background:#334155}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand"><h1>面試安排</h1><span class="sub">招募系統 · Interview Arrangements</span></div>
    <nav class="nav">
      <a href="index.html">邀約紀錄</a>
      <a href="arrangements.html" class="active">面試安排</a>
    </nav>
  </div>

  <div class="rolebar">
    <span style="font-weight:700;font-size:12.5px">目前身分</span>
    <div class="roleseg">
      <button data-role="HR" class="on">HR</button>
      <button data-role="MANAGER">主管 Manager</button>
    </div>
    <span class="roledesc" id="roleDesc"></span>
    <div class="mgrfilter">
      <label style="font-size:12.5px;color:var(--muted)">主管篩選</label>
      <select id="managerFilter"><option value="">全部主管</option></select>
    </div>
  </div>

  <div id="banner" class="banner"></div>

  <div class="toolbar">
    <input id="q" type="search" placeholder="搜尋候選人 / 職位 / 主管…">
    <span class="count" id="count"></span>
  </div>

  <div class="grid">
    <table>
      <thead>
        <tr id="headRow"></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <footer id="foot"></footer>
</div>

<div class="mask" id="mask"></div>

<div class="drawer" id="drawer" role="dialog" aria-modal="true">
  <div class="dhead">
    <h2 id="drTitle">面試安排</h2>
    <span class="rolechip" id="drRole"></span>
    <button class="x" data-close>×</button>
  </div>
  <div class="dbody" id="drBody"></div>
</div>

<div id="toasts"></div>

<script>
const ROLE_DESC = { HR:'', MANAGER:'' };

const SEED = [
  {id:1,invitationId:3,candidateName:"陳志豪",jobTitle:"資深Java軟體工程師",resumeLink:"https://example.invalid/resume/3",gender:null,examType:null,location:null,interviewManager:null,selectedManager:null,managerPreferredDates:null,interviewTime:null,managerRemark:null,candidateReplyLink:null,managerAssignedAt:null,calendarId:null},
  {id:2,invitationId:4,candidateName:"林品妤",jobTitle:"SA系統分析師",resumeLink:"https://example.invalid/resume/4",gender:"FEMALE",examType:"AI",location:"南港",interviewManager:"Sherry/John",selectedManager:"Sherry",managerPreferredDates:"Sherry 9/5 下午、9/8 上午\nJohn 9/10 下午、9/11 上午",interviewTime:"2026-09-08T10:00:00",managerRemark:"優先給 Sherry 面試",candidateReplyLink:null,mailSystemStatus:"已處理",mailSentAt:"2026-09-02T15:20:00",managerAssignedAt:"2026-08-26T09:00:00",calendarId:null},
];

let rows = [], OFFLINE=false, role="HR", currentId=null;
const $ = s=>document.querySelector(s);

function toast(msg,kind="info"){const t=document.createElement("div");t.className="toast "+kind;t.textContent=msg;$("#toasts").appendChild(t);setTimeout(()=>t.remove(),3200);}
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function fmtDate(v){if(!v)return '<span class="missing">—</span>';const d=new Date(v);if(isNaN(d))return esc(v);const p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}
const dash = v => v ? esc(v) : '<span class="missing">未填</span>';

async function api(method, path, body){
  const opt={method,headers:{}};
  if(body!==undefined){opt.headers["Content-Type"]="application/json";opt.body=JSON.stringify(body);}
  const res=await fetch("/api/v1"+path,opt);
  let json=null; try{json=await res.json();}catch(e){}
  if(!res.ok||(json&&json.success===false)){
    const err=json&&json.error?json.error:{message:"HTTP "+res.status};
    const e=new Error(err.message||err.code||("HTTP "+res.status)); e.code=err.code; throw e;
  }
  return json?json.data:null;
}

/* 角色切換 */
function setRole(r){
  role=r;
  try{ localStorage.setItem("arr_role", r); }catch(e){}   // 記住角色：refresh 後不跳回 HR
  document.querySelectorAll(".roleseg button").forEach(b=>b.classList.toggle("on",b.dataset.role===r));
  $("#roleDesc").innerHTML = ROLE_DESC[r];
  render();
  if(currentId!=null) openDrawer(currentId);
}
document.querySelectorAll(".roleseg button").forEach(b=>b.addEventListener("click",()=>setRole(b.dataset.role)));

function render(){
  // 多條件篩選：主管下拉（AND）＋ 搜尋框（可空格分多個關鍵字，每個都要命中候選人／職位／主管）
  const tokens=$("#q").value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const mf=$("#managerFilter").value.trim().toLowerCase();
  const view=rows.filter(r=>{
    if(mf && !parseManagers(r.interviewManager).some(m=>m.toLowerCase()===mf)) return false;
    if(tokens.length){
      const hay=`${r.candidateName||""} ${r.jobTitle||""} ${r.interviewManager||""}`.toLowerCase();
      if(!tokens.every(t=>hay.includes(t))) return false;
    }
    return true;
  });
  $("#count").textContent=`共 ${view.length} 筆`+(view.length!==rows.length?`（總 ${rows.length}）`:"");
  // 表頭：HR 身分於最後多兩欄「發信狀態」（成功／失敗，供人工另外寄送之提醒）＋「發信時間」（最近一次寄送時間）
  // 操作固定於最右（sticky）；HR 的「發信狀態／發信時間」置於操作之左，右滑即可顯示
  const heads=["編號","候選人","職位名稱","履歷","面試主管","可面試日期","面試時間","主管備註","面試者回傳資料"];
  if(role==="HR") heads.push("發信狀態","發信時間");
  heads.push("操作");
  $("#headRow").innerHTML=heads.map(h=>`<th>${h}</th>`).join("");
  const tb=$("#tbody");
  if(view.length===0){tb.innerHTML=`<tr><td colspan="${heads.length}" class="empty">目前沒有面試安排（人選轉為「信件溝通中」後會自動帶入）</td></tr>`;return;}
  const hrCol = role==="HR"?"colhr":"", mgrCol = role==="MANAGER"?"colmgr":"";
  const btnClass = role==="HR"?"hr":"mgr";
  tb.innerHTML=view.map(r=>`
    <tr>
      <td>${r.id}</td>
      <td>${dash(r.candidateName)}</td>
      <td>${dash(r.jobTitle)}</td>
      <td>${r.resumeLink?`<a class="reslink" href="${esc(r.resumeLink)}" target="_blank" rel="noopener">檢視履歷 ↗</a>`:'<span class="missing">—</span>'}</td>
      <td class="${mgrCol}">${dash(r.interviewManager)}</td>
      <td class="dates ${mgrCol}">${dash(r.managerPreferredDates)}</td>
      <td class="${hrCol}">${fmtDate(r.interviewTime)}</td>
      <td class="${mgrCol}">${dash(r.managerRemark)}</td>
      <td>${r.candidateReplyLink?`<a class="reslink" href="${esc(r.candidateReplyLink)}" target="_blank" rel="noopener">檢視回傳 ↗</a>`:'<span class="missing">未回傳</span>'}</td>
      ${role==="HR"?`<td class="${hrCol}">${mailStatusCell(r)}</td><td class="${hrCol}">${r.mailSentAt?fmtDate(r.mailSentAt):'<span class="missing">—</span>'}</td>`:""}
      <td><button class="btn ${btnClass} sm" data-edit="${r.id}">${role==="HR"?"安排面試":"挑此人選"}</button></td>
    </tr>`).join("");
  tb.querySelectorAll("[data-edit]").forEach(b=>b.addEventListener("click",()=>openDrawer(Number(b.dataset.edit))));
}

/* 發信狀態欄（HR）：已處理→成功；其他非空值（寄送失敗）→失敗（紅字提醒，HR 可於抽屜重按「儲存並發信」人工重寄）；尚未發信→未發信。 */
function mailStatusCell(r){
  const s=r.mailSystemStatus;
  if(!s) return '<span class="missing">未發信</span>';
  if(s==="已處理") return '<span class="mstat ok">成功</span>';
  return '<span class="mstat err" title="寄信未成功，請人工另外寄送">失敗</span>';
}

function openMask(){$("#mask").classList.add("show");}
function closeAll(){$("#mask").classList.remove("show");$("#drawer").classList.remove("show");currentId=null;}
$("#mask").addEventListener("click",closeAll);
document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",closeAll));
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeAll();});

function toLocalInput(v){ if(!v)return ""; const d=new Date(v); if(isNaN(d))return ""; const p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }

function openDrawer(id, unlock=false){
  currentId=id;
  const r=rows.find(x=>x.id===id); if(!r)return;
  $("#drTitle").textContent=`#${r.id} ${r.candidateName||""}`;
  const chip=$("#drRole"); chip.className="rolechip "+role; chip.textContent=role==="HR"?"HR":"主管";
  $("#drBody").innerHTML=drawerBody(r, unlock);
  wireDrawer(r);
  openMask(); $("#drawer").classList.add("show");
}

function drawerBody(r, unlock=false){
  const info=`
  <div class="sect">
    <h3>候選人資訊</h3>
    <div class="kv">
      <dt>面試安排 id</dt><dd>${r.id}</dd>
      <dt>邀約紀錄 id</dt><dd>${r.invitationId}</dd>
      <dt>候選人</dt><dd>${dash(r.candidateName)}</dd>
      <dt>職位名稱</dt><dd>${dash(r.jobTitle)}</dd>
      <dt>履歷</dt><dd>${r.resumeLink?`<a class="reslink" href="${esc(r.resumeLink)}" target="_blank" rel="noopener">檢視履歷 ↗</a>`:'—'}</dd>
      <dt>面試者回傳資料</dt><dd>${r.candidateReplyLink?`<a class="reslink" href="${esc(r.candidateReplyLink)}" target="_blank" rel="noopener">檢視回傳 ↗</a>`:'<span class="missing">未回傳</span>'}</dd>
    </div>
  </div>`;

  if(role==="MANAGER"){
    return info+`
    <div class="sect">
      <h3>主管填寫</h3>
      <div class="field"><label>面試主管（填自己的名字；多位可用 / 分隔）</label><input id="m_manager" value="${esc(r.interviewManager)}" placeholder="例：Sherry/John"></div>
      <div class="field"><label>可面試日期（可換行，一位主管一行）</label><textarea id="m_dates" style="min-height:76px" placeholder="Sherry 9/5 下午、9/8 上午&#10;John 9/10 下午、9/11 上午">${esc(r.managerPreferredDates)}</textarea><div id="m_dates_err" class="ferr" hidden>請輸入可面試日期</div></div>
      <div class="field"><label>主管備註</label><textarea id="m_remark">${esc(r.managerRemark)}</textarea></div>
      <div class="actions"><button class="btn mgr" id="btnMgr">儲存</button></div>
    </div>`;
  }
  // HR
  const managers = parseManagers(r.interviewManager);
  const mailSent = r.mailSystemStatus === "已處理";   // 已成功寄出面試通知信 → 鎖定欄位與雙按鈕
  const locked = mailSent && !unlock;                 // 「重新安排」可暫時解鎖，供臨時改期
  const dis = locked ? " disabled" : "";
  const sel = (val,opt)=> (val||"")===opt ? " selected" : "";
  const managerSelect = managers.length>1 ? `
      <div class="field"><label>選定單一主管</label>
        <select id="h_selmgr"${dis}>
          <option value="">－不選定－</option>
          ${managers.map(m=>`<option${(r.selectedManager||"").toLowerCase()===m.toLowerCase()?" selected":""}>${esc(m)}</option>`).join("")}
        </select></div>` : "";
  return info+`
    <div class="sect">
      <h3>主管已提供</h3>
      <div class="kv">
        <dt>面試主管</dt><dd>${dash(r.interviewManager)}</dd>
        <dt>可面試日期</dt><dd style="white-space:pre-line">${dash(r.managerPreferredDates)}</dd>
        <dt>主管備註</dt><dd>${dash(r.managerRemark)}</dd>
      </div>
    </div>
    <div class="sect">
      <h3>HR 安排面試</h3>
      <div class="field"><label>面試時間</label><input type="datetime-local" id="h_time" min="${toLocalInput(Date.now())}" value="${toLocalInput(r.interviewTime)}"${dis}></div>
      <div class="field"><label>性別</label>
        <select id="h_gender"${dis}>
          <option value=""${sel(r.gender,"")}>— 未填 —</option>
          <option value="MALE"${sel(r.gender,"MALE")}>男</option>
          <option value="FEMALE"${sel(r.gender,"FEMALE")}>女</option>
        </select></div>
      <div class="field"><label>上機考題目</label>
        <select id="h_exam"${dis}>
          <option value=""${sel(r.examType,"")}>— 未填 —</option>
          <option${sel(r.examType,"基本")}>基本</option>
          <option${sel(r.examType,"AI")}>AI</option>
        </select></div>
      <div class="field"><label>面試地點</label>
        <select id="h_loc"${dis}>
          <option value=""${sel(r.location,"")}>— 未填 —</option>
          <option${sel(r.location,"南港")}>南港</option>
          <option${sel(r.location,"板橋")}>板橋</option>
        </select></div>
      ${managerSelect}
      ${locked
        ? `<div class="actions"><button class="btn hr" id="btnHrSave" disabled>儲存</button><button class="btn hr" id="btnHrSend" disabled>儲存並發信</button></div>
           <div class="lock" style="margin-top:8px;display:flex;align-items:center;gap:10px">
             <span style="flex:1">系統已寄送面試邀請。${r.mailSentAt?`<br>發信時間：${fmtDate(r.mailSentAt)}`:""}</span>
             <button class="btn hr sm" id="btnReschedule">重新安排</button>
           </div>`
        : `<div class="actions"><button class="btn" id="btnHrSave">儲存</button><button class="btn hr" id="btnHrSend">儲存並發信</button></div>`}
    </div>`;
}

/* 面試主管欄解析（與後端一致：/ 、 , & 分隔，去重保序） */
function parseManagers(s){
  if(!s) return [];
  const seen=new Set(), out=[];
  s.split(/[/、,&]/).forEach(p=>{const n=p.trim(); if(n && !seen.has(n.toLowerCase())){seen.add(n.toLowerCase()); out.push(n);}});
  return out;
}

/* 主管篩選下拉：由目前面試安排資料彙整所有面試主管名字（去重、排序） */
function populateManagerFilter(){
  const sel=$("#managerFilter"); if(!sel) return;
  const prev=sel.value;
  const seen=new Set(), names=[];
  rows.forEach(r=>parseManagers(r.interviewManager).forEach(n=>{const k=n.toLowerCase(); if(!seen.has(k)){seen.add(k); names.push(n);}}));
  names.sort((a,b)=>a.localeCompare(b));
  sel.innerHTML=`<option value="">全部主管</option>`+names.map(n=>`<option value="${esc(n)}"${n===prev?" selected":""}>${esc(n)}</option>`).join("");
}

function wireDrawer(r){
  if(role==="MANAGER"){
    $("#btnMgr").addEventListener("click",()=>saveManager(r.id));
    const de=$("#m_dates"), derr=$("#m_dates_err");
    if(de) de.addEventListener("input",()=>{ if(de.value.trim()){ derr.hidden=true; de.classList.remove("invalid"); }});
    return;
  }
  const save=$("#btnHrSave"), send=$("#btnHrSend"), resch=$("#btnReschedule");
  if(save && !save.disabled) save.addEventListener("click",()=>saveHr(r.id,false));
  if(send && !send.disabled) send.addEventListener("click",()=>saveHr(r.id,true));
  // 重新安排：暫時解鎖已鎖定的欄位與按鈕，供臨時改期的面試者
  if(resch) resch.addEventListener("click",()=>openDrawer(r.id,true));
}

async function saveManager(id){
  const manager=$("#m_manager").value.trim();
  const dates=$("#m_dates").value.trim();
  const remark=$("#m_remark").value.trim();
  // 可面試日期未填寫時：欄下顯示紅字提示、不儲存
  const datesEl=$("#m_dates"), datesErr=$("#m_dates_err");
  if(!dates){
    datesErr.hidden=false; datesEl.classList.add("invalid"); datesEl.focus();
    return;
  }
  datesErr.hidden=true; datesEl.classList.remove("invalid");
  const body={interviewManager:manager||null, managerPreferredDates:dates||null, managerRemark:remark||null};
  try{
    if(OFFLINE){
      const r=rows.find(x=>x.id===id);
      if(body.interviewManager && !r.interviewManager) r.managerAssignedAt=new Date().toISOString();
      r.interviewManager=body.interviewManager; r.managerPreferredDates=body.managerPreferredDates; r.managerRemark=body.managerRemark;
      toast("已儲存（示範模式）","ok");
    }else{
      const upd=await api("PATCH","/arrangements/"+id+"/manager-fields",body);
      replaceRow(upd); toast("主管欄位已更新","ok");
    }
    populateManagerFilter(); render();
    // 儲存成功後一律自動關閉右側面板（等同點右上 ×）
    closeAll();
  }catch(err){ toast(err.message||"儲存失敗","err"); }
}

async function saveHr(id, sendMail){
  // 「儲存」不擋未填欄位（欄位級更新，留空者保留原值）；「儲存並發信」才需資料齊備。
  // 多主管時「選定單一主管」可留空（不選定＝寄信一起 CC 全部主管），故不強制選定。
  const raw=$("#h_time").value;
  const iso = raw ? (raw.length===16 ? raw+":00" : raw) : null;
  const g=$("#h_gender").value, ex=$("#h_exam").value, lo=$("#h_loc").value;
  const smEl=$("#h_selmgr");   // 僅多主管時存在
  if(iso && new Date(iso).getTime() <= Date.now()){ toast("面試時間不可為過去","err"); return; }
  if(sendMail){
    if(!iso){ toast("發信前請選擇面試時間","err"); return; }
    if(!g || !ex || !lo){ toast("發信前請完整填選：性別／上機考題目／面試地點","err"); return; }
  }
  // 只送有填的欄位（欄位級更新）：面試時間／性別／上機考題目／面試地點留空時保留原值、不覆寫
  const body={};
  if(iso) body.interviewTime=iso;
  if(g) body.gender=g;
  if(ex) body.examType=ex;
  if(lo) body.location=lo;
  if(smEl) body.selectedManager=smEl.value;   // 多主管：送出選定；空字串＝不選定（清除、寄信一起 CC）
  try{
    if(OFFLINE){
      const r=rows.find(x=>x.id===id);
      if(iso) r.interviewTime=iso;
      if(body.gender!==undefined) r.gender=body.gender;
      if(body.examType!==undefined) r.examType=body.examType;
      if(body.location!==undefined) r.location=body.location;
      if(body.selectedManager!==undefined) r.selectedManager=body.selectedManager;
      if(sendMail) r.mailSystemStatus="已處理";
      toast(sendMail?"已儲存並發信（示範模式）":"已儲存（示範模式）","ok");
    }else{
      const upd=await api("PATCH","/arrangements/"+id+"/interview-time?sendMail="+sendMail,body);
      replaceRow(upd);
      toast(sendMail?("面試時間已排定"+(upd&&upd.mailSystemStatus?"，寄信"+upd.mailSystemStatus:"")):"已儲存","ok");
    }
    render();
    // 儲存／儲存並發信成功後一律自動關閉右側面板（等同點右上 ×）
    closeAll();
  }catch(err){
    toast(err.message||"儲存失敗","err");
    // 線上模式：發信失敗時後端已把面試安排標記為「寄送失敗」，重抓資料讓 HR 表的「發信狀態」即時反映（供人工另外寄送之提醒）
    if(!OFFLINE && sendMail){ try{ await load(); if(currentId!=null) openDrawer(id); }catch(e){} }
  }
}

function replaceRow(u){const i=rows.findIndex(x=>x.id===u.id);if(i>=0)rows[i]=u;else rows.push(u);}

async function load(){
  const banner=$("#banner");
  try{
    const data=await api("GET","/arrangements");
    rows=Array.isArray(data)?data:(data&&data.content?data.content:[]);
    OFFLINE=false; banner.style.display="none";
  }catch(e){
    rows=JSON.parse(JSON.stringify(SEED)); OFFLINE=true;
    banner.style.display="block";
    banner.textContent=`⚠ 未連到後端 API（${e.message}）——目前為示範模式，操作僅存在於畫面。啟動 Spring Boot 後重新整理即可連動真實資料。`;
  }
  populateManagerFilter();
  render();
}

$("#q").addEventListener("input",render);
$("#managerFilter").addEventListener("change",render);

/* 滾輪左右滑動：在表格上滾動時，直向滾輪轉為橫向捲動；到達左右邊界才交還頁面捲動 */
(function(){
  const grid=document.querySelector(".grid");
  if(!grid) return;
  grid.addEventListener("wheel",e=>{
    if(e.deltaX!==0) return;                       // 觸控板已是橫向 → 不干預
    const max=grid.scrollWidth-grid.clientWidth;
    if(max<=1) return;                             // 沒有橫向可捲 → 交給頁面
    const canLeft=grid.scrollLeft>0, canRight=grid.scrollLeft<max-1;
    if((e.deltaY<0&&canLeft)||(e.deltaY>0&&canRight)){
      grid.scrollLeft+=e.deltaY;
      e.preventDefault();
    }
  },{passive:false});
})();
// 還原上次所選角色（refresh 後停留在同一 tab，例如主管）
let savedRole="HR"; try{ const s=localStorage.getItem("arr_role"); if(s==="HR"||s==="MANAGER") savedRole=s; }catch(e){}
setRole(savedRole);
$("#foot").textContent="";
load();
</script>
